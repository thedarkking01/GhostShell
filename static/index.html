<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GhostShell</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="friendly">
  <div id="terminal">
    <div id="topbar">
      <span id="status-dot"></span>
      <span id="status-text">checking...</span>
      <span id="personality-label">[ friendly ghost ]</span>
    </div>
    <div id="output">
      <div class="ghost-line">GhostShell v1.0 — type <span class="cmd">help</span> to begin</div>
    </div>
    <div id="input-row">
      <span class="prompt">ghostshell@localhost:~$</span>
      <input id="input" type="text" autofocus autocomplete="off" spellcheck="false" />
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
